name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and development dependencies
        run: |
          pip install -e .
          pip install build twine pytest pytest-cov

      - name: Run tests
        run: pytest

      - name: Build package
        run: python -m build

      - name: Verify package
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tree-printer-distributions
          path: dist/