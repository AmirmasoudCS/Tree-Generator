[project]
name = "tree-printer"
version = "0.3.0"
description = "A Python CLI tool for generating clean directory tree structures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT"}
authors = [
    { name = "AmirmasoudCS"}
]
dependencies = [
    "pathspec",
    "rich"
]

[project.scripts]
tree-printer = "tree_printer.cli:run"
tp = "tree_printer.cli:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["tree_printer*"]

[project.urls]
Homepage = "https://github.com/AmirmasoudCS/Tree-Printer"
Repository = "https://github.com/AmirmasoudCS/Tree-Printer"
Issues = "https://github.com/AmirmasoudCS/Tree-Printer/issues"

keywords = [
    "tree",
    "cli",
    "directory",
    "filesystem",
    "terminal"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
