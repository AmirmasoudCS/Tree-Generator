[project]
name = "tree-printer"
version = "0.3.0"
description = "A Python CLI tool for generating clean directory tree structures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT"}
authors = [
    { name = "AmirmasoudCS"}
]
dependencies = [
    "pathspec",
    "rich"&nbsp;&nbsp;
]

[project.scripts]
tree-printer = "tree_printer.cli:run"
tp = "tree_printer.cli:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["tree_printer*"]


