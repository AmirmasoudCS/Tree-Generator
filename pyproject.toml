[project]
name = "tree-printer"
version = "0.1.0"
description = "A Python CLI tool for generating clean directory tree structures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT"}
authors = [
    { name = "AmirmasoudCS"}
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project.scripts]
tree-printer = "tree_printer.cli:run"
tp = "tree_printer.cli:run"